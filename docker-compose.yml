version: '3.8'

services:
  # Infrastructure
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - spendsmart-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - spendsmart-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - spendsmart-network

  # Discovery
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - spendsmart-network

  # Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_SERVER_HOST=eureka-server
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - spendsmart-network

  # Microservices
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis
      - EUREKA_SERVER_HOST=eureka-server
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
      - AUTH_GOOGLE_REDIRECT_URI=${AUTH_GOOGLE_REDIRECT_URI:-http://localhost:8081/login/oauth2/code/google}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - spendsmart-network

  expense-service:
    build: ./expense-service
    container_name: expense-service
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - RABBITMQ_HOST=rabbitmq
      - EUREKA_SERVER_HOST=eureka-server
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - spendsmart-network

  income-service:
    build: ./income-service
    container_name: income-service
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - RABBITMQ_HOST=rabbitmq
      - EUREKA_SERVER_HOST=eureka-server
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - spendsmart-network

  recurring-service:
    build: ./recurring-service
    container_name: recurring-service
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - EUREKA_SERVER_HOST=eureka-server
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - spendsmart-network

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - EUREKA_SERVER_HOST=eureka-server
      - JWT_SECRET=${JWT_SECRET}
      - RAZORPAY_KEY=${RAZORPAY_KEY}
      - RAZORPAY_SECRET=${RAZORPAY_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - spendsmart-network

  budget-service:
    build: ./budget-service
    container_name: budget-service
    ports:
      - "8086:8086"
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - EUREKA_SERVER_HOST=eureka-server
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - spendsmart-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8087:8087"
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - RABBITMQ_HOST=rabbitmq
      - EUREKA_SERVER_HOST=eureka-server
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - spendsmart-network

  category-service:
    build: ./category-service
    container_name: category-service
    ports:
      - "8088:8088"
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - EUREKA_SERVER_HOST=eureka-server
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - spendsmart-network

  summary-service:
    build: ./summary-service
    container_name: summary-service
    ports:
      - "8089:8089"
    environment:
      - DB_HOST=mysql
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis
      - EUREKA_SERVER_HOST=eureka-server
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - spendsmart-network

networks:
  spendsmart-network:
    driver: bridge
