server:
  port: 8084

spring:
  application:
    name: recurring-service
  
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/spendsmart_recurring?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      validation-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 1800000
      minimum-idle: 1
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  # quartz:
#   job-store-type: memory
#   properties:
#     org:
#       quartz:
#         scheduler:
#           instanceId: AUTO
#           instanceName: clusteredScheduler
#         jobStore:
#           class: org.quartz.simpl.RAMJobStore
#         threadPool:
#           class: org.quartz.simpl.SimpleThreadPool
#           threadCount: 10
#           threadPriority: 5
#           threadsInheritContextClassLoaderOfInitializingThread: true
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:your-email@gmail.com}
    password: ${EMAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_SERVER_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.spendsmart.recurring: DEBUG
    org.springframework.scheduling: DEBUG
    org.quartz: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/recurring-service.log

# Custom application properties
app:
  recurring:
    reminder:
      default-reminder-days-before: 3
      max-retry-attempts: 3
      retry-delay-minutes: 15
    scheduler:
      enabled: true
      timezone: UTC
    cleanup:
      expired-reminders-days: 7
      failed-reminders-days: 30

# JWT configuration
jwt:
  secret: ${JWT_SECRET}

# Swagger/OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method




